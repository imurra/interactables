<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Circulation Integration Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Projector layout: plum band with case switch; left = loop diagram over Frank-Starling plot + readouts; right = one step at a time. Fits one 16:9 screen at ≥1280px. */
:root{
  --ground:#d6e6f8; --surface:#f4f8f7; --cell:#e7f1ef; --line:#bfd0db;
  --ink:#16131a; --muted:#4b5360; --plum:#3f0538; --plum-ink:#fff;
  --pred:#b5121b; --ok:#1d7a46; --ok-bg:#d9eedf; --bad:#a3261c; --bad-bg:#f7dfdb; --warn:#a07410; --warn-bg:#fbefd2;
  --redact:#000; --plate:#fff; --focus:#0b63c9; --grid:#d3dbe2; --curve0:#7b8591; --comp:#3f0538;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121821; --surface:#1b2330; --cell:#232d3b; --line:#36434f; --ink:#eef1f5; --muted:#a9b3bf; --plum:#4d1446; --plum-ink:#fff;
  --pred:#ff7d75; --ok:#6fd49a; --ok-bg:#183326; --bad:#ff8f84; --bad-bg:#3a1d1b; --warn:#f0c35a; --warn-bg:#3a3018;
  --redact:#04060a; --plate:#f7f7f5; --focus:#7db4ff; --grid:#2c3846; --curve0:#8c97a4; --comp:#d9a6f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121821; --surface:#1b2330; --cell:#232d3b; --line:#36434f; --ink:#eef1f5; --muted:#a9b3bf; --plum:#4d1446; --plum-ink:#fff;
  --pred:#ff7d75; --ok:#6fd49a; --ok-bg:#183326; --bad:#ff8f84; --bad-bg:#3a1d1b; --warn:#f0c35a; --warn-bg:#3a3018;
  --redact:#04060a; --plate:#f7f7f5; --focus:#7db4ff; --grid:#2c3846; --curve0:#8c97a4; --comp:#d9a6f0; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(15px,1.12vw,22px)}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--plum);color:var(--plum-ink);padding-block:.7rem}
.bandrow{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center;justify-content:space-between;max-width:1800px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;line-height:1.1}
.band .sub{font-family:var(--display);font-weight:700;font-size:.95rem;opacity:.9;margin:.15rem 0 0}
.cases{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.case{background:transparent;border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:.35rem 1rem;font-weight:700;font-size:1rem}
.case[aria-selected="true"]{background:#fff;color:#3f0538;border-color:#fff}
.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:6px;padding:.3rem .7rem;font-size:.8rem;font-weight:700}
.main{padding-block:.8rem 1.2rem;max-width:1800px;margin:0 auto}
.stem{margin:0 0 .7rem;font-size:1.05rem;max-width:none}
.stem b{font-family:var(--display)}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.7rem;min-width:0}
.views{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:.6rem}
.views button{flex:1;background:transparent;border:0;padding:.45rem .3rem;font-weight:700;font-size:.92rem;border-right:1px solid var(--line)}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink)}
.views button:disabled{opacity:.35;cursor:not-allowed}
.stage{position:relative;background:var(--plate);border-radius:6px;overflow:hidden;aspect-ratio:1200/760;width:100%;max-width:max(18rem,calc((100vh - 17rem) * 1.579));margin:0 auto}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hot{fill:transparent;stroke:transparent;stroke-width:6;transition:fill .2s,stroke .2s}
.picking .hot{cursor:pointer;stroke:rgba(63,5,56,.4);stroke-dasharray:14 10}
.picking .hot:hover,.picking .hot:focus{fill:rgba(255,214,0,.2);stroke:#3f0538}
.hot.chosen{stroke:#3f0538;stroke-dasharray:none;fill:rgba(255,214,0,.18)}
.hot.right{stroke:#1d7a46;stroke-dasharray:none;fill:rgba(29,122,70,.12)}
.flow{fill:none;stroke:#0e6f8f;stroke-width:10;stroke-linecap:round;stroke-dasharray:1 38;animation:flow var(--dur,6s) linear infinite}
@keyframes flow{to{stroke-dashoffset:-390}}
.pulse{transform-origin:595px 280px;animation:beat var(--beat,.83s) ease-out infinite}
@keyframes beat{0%{transform:scale(1);opacity:var(--glow,.3)}25%{transform:scale(1.07);opacity:calc(var(--glow,.3) + .15)}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
.stage{container-type:inline-size}
.badge{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:700;font-size:clamp(9px,2.2cqw,22px);padding:.15em .55em;border-radius:5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.badge.v{background:#2f3f86}.badge.a{background:#a8302a}.badge.h{background:#6b1d5e}
.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem;margin-top:.7rem;align-items:start}
@media (max-width:560px){.under{grid-template-columns:minmax(0,1fr)}}
.fs{display:block;width:100%;max-height:13rem}
.fs text{font-family:var(--body);fill:var(--muted);font-size:12px}
.fs .ax{stroke:var(--muted);stroke-width:1.2}
.fs .gl{stroke:var(--grid);stroke-width:1}
.fs .c0{fill:none;stroke:var(--curve0);stroke-width:2.4}
.fs .c2{fill:none;stroke:var(--comp);stroke-width:2.4;stroke-dasharray:3 4}
.fs .pt{stroke:var(--surface);stroke-width:2}
.fs .lbl{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--ink)}
.fs .trail{fill:none;stroke:var(--ink);stroke-width:1.4}
.ro{width:100%;border-collapse:collapse;font-size:.88rem}
.ro th,.ro td{padding:.18rem .3rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ro th:first-child,.ro td:first-child{text-align:left}
.ro td.ar{text-align:center}
.ro th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ro td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ro .ar{font-weight:800;color:var(--pred)}
.ro tr.key td{font-weight:700}
.eq{font-family:var(--display);font-weight:700;margin-top:.5rem;font-size:.95rem}
.eq .v{font-family:var(--mono);background:var(--cell);padding:0 .3em;border-radius:4px}
.gauge{position:relative;height:12px;background:var(--cell);border:1px solid var(--line);border-radius:6px;margin-top:.35rem;overflow:hidden}
.gauge .norm{position:absolute;top:0;bottom:0;background:var(--ok-bg);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.gauge .fill{position:absolute;top:2px;bottom:2px;left:2px;background:var(--pred);border-radius:5px;transition:width .6s}
.gscale{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);font-family:var(--mono)}
.skin{display:flex;gap:.5rem;align-items:center;margin-top:.45rem;font-size:.9rem}
.swatch{width:2.4rem;height:1.4rem;border-radius:.7rem;border:1px solid var(--line);transition:background .6s;flex:none}
.note{font-size:.7rem;color:var(--muted);margin:.4rem 0 0}
/* right column */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem;margin-bottom:.7rem}
.sbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.4rem .5rem;text-align:left;font-size:.8rem;line-height:1.2;color:var(--muted)}
.sbtn b{display:block;font-family:var(--display);font-size:.95rem;color:var(--ink)}
.sbtn[aria-current="step"]{background:var(--plum);border-color:var(--plum);color:#e9d6e6}
.sbtn[aria-current="step"] b{color:#fff}
.sbtn.done b::after{content:" ✓";color:var(--ok)}
.sbtn[aria-current="step"].done b::after{color:#8fe3b0}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem}
.card h2{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0;line-height:1.15}
.card .q{color:var(--muted);margin:.15rem 0 .7rem;font-size:1.05rem}
.sites{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{background:var(--cell);border:2px solid var(--line);border-radius:8px;padding:.5rem .9rem;font-weight:700;font-size:1.05rem;text-align:left}
.btn[aria-pressed="true"]{border-color:var(--plum);box-shadow:inset 0 0 0 1px var(--plum)}
.btn.ok{border-color:var(--ok);background:var(--ok-bg)} .btn.no{border-color:var(--bad);background:var(--bad-bg)} .btn.part{border-color:var(--warn);background:var(--warn-bg)}
.opts{display:grid;gap:.45rem;margin-top:.7rem}
.preds{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr))}
.pred{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.15rem .6rem;background:var(--cell);border:2px solid var(--line);border-radius:8px;padding:.3rem .35rem .3rem .75rem;font-weight:700;font-size:1.08rem}
.pred.ok{border-color:var(--ok);background:var(--ok-bg)} .pred.no{border-color:var(--bad);background:var(--bad-bg)}
.pred .fix{grid-column:1 / -1;font-size:.85rem;font-weight:400;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);width:2.6rem;height:2.1rem;font-size:1.25rem;font-weight:800}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--pred);color:#fff}
.fsq{margin-top:.6rem}
.fsq .lab{font-weight:700;margin-bottom:.35rem}
.fsq .opts{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0}
.fsq .btn{font-size:.92rem;padding:.4rem .5rem}
.fsq .btn.sel{border-color:var(--pred);box-shadow:inset 0 0 0 1px var(--pred)}
.row{display:flex;gap:.6rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}
.go{background:var(--plum);color:var(--plum-ink);border:0;border-radius:8px;padding:.55rem 1.2rem;font-weight:700;font-size:1.05rem}
.go:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;text-decoration:underline;color:var(--muted);font-size:.9rem}
.fb{margin-top:.7rem;padding:.6rem .8rem;border-radius:6px;font-size:1rem}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)} .fb.no{background:var(--bad-bg);border-left:5px solid var(--bad)} .fb.part{background:var(--warn-bg);border-left:5px solid var(--warn)}
.chainline{font-weight:700;color:var(--pred);display:block;margin-top:.2rem}
.take{background:var(--plum);color:var(--plum-ink);border-left:0}
.take b{font-family:var(--display)}
table.cmp{border-collapse:collapse;width:100%;font-size:1.02rem;margin-top:.3rem}
.cmp th,.cmp td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
.cmp th{background:var(--cell);font-family:var(--display)}
.cmp td.x{background:var(--redact);color:transparent;user-select:none}
.cmp td.a{font-weight:700;color:var(--pred)}
.capline{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.5rem;font-weight:700}
.cap{font-family:var(--display);font-size:1rem}
.skinchip{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem}
.sw{display:inline-block;width:1.8rem;height:1.05rem;border-radius:.55rem;border:1px solid var(--line);vertical-align:middle;margin-right:.35rem;transition:background .6s}
.views button:disabled{opacity:.55}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 .5em;white-space:nowrap;vertical-align:middle}
:root .take .tag{color:var(--plum)}
.fsrow{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:.8rem;align-items:center;margin-top:.7rem}
@media (max-width:560px){.fsrow{grid-template-columns:minmax(0,1fr)}}
.fs.tap{cursor:crosshair;background:var(--cell);border-radius:6px;outline:2px dashed var(--pred);outline-offset:-2px}
.fs.mini{background:var(--cell);border-radius:6px}
.fs .pt.ghost{opacity:.45}
.debrief{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:.8rem;align-items:center;margin-top:.7rem}
@media (max-width:760px){.debrief{grid-template-columns:minmax(0,1fr)}}
table.db{border-collapse:collapse;width:100%;font-size:.92rem}
.db th,.db td{border-bottom:1px solid var(--line);padding:.25rem .35rem;text-align:right}
.db td:first-child{white-space:nowrap}
.legend2{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.45rem;font-size:.8rem;color:var(--muted)}
.legend2 b{color:var(--ink)}
.db th:first-child,.db td:first-child{text-align:left}
.db td.on{background:var(--cell)}
.db td.sm{font-size:.78rem}
.db .u{color:var(--muted);font-size:.78em;font-weight:400}
.db .ar{color:var(--pred);font-weight:800}
.db tr.key td{font-weight:700}
.colbtn{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:.2rem .5rem;font-family:var(--display);font-weight:800;font-size:.9rem}
.colbtn[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.tscroll{overflow-x:auto;min-width:0}
.tags{margin:.6rem 0 0;display:flex;gap:.4rem;flex-wrap:wrap}
@media (max-width:560px){.stepper{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<header class="band pad"><div class="bandrow">
  <div>
    <h1>Activity 4: Integration</h1>
    <p class="sub">What changed first → What happens because of it → How does the body compensate?</p>
  </div>
  <div class="cases" role="tablist" id="cases"></div>
  <div class="cases">
    <button class="ghost" id="resetBtn" type="button">Reset case</button>
    <button class="ghost" id="revealAll" type="button">Reveal all</button>
  </div>
</div></header>

<main class="main pad">
  <p class="stem" id="stem"></p>
  <div class="layout">
    <section class="panel" aria-label="Circulation">
      <div class="views" id="views" role="group" aria-label="Circulation state">
        <button type="button" id="v-base">Normal</button>
        <button type="button" id="v-pre">Change</button>
        <button type="button" id="v-comp">Compensated</button>
      </div>

/* Frank-Starling plot builder */
const FW=360,FH=250,FL=46,FR=12,FT=12,FB=40,FX0=40,FX1=180,FY1=110;
const FX=v=>FL+(v-FX0)/(FX1-FX0)*(FW-FL-FR), FY=v=>FH-FB-v/FY1*(FH-FT-FB);
const invX=x=>FX0+(x-FL)/(FW-FL-FR)*(FX1-FX0), invY=y=>(FH-FB-y)/(FH-FT-FB)*FY1;
function fsSVG(pts,curves){
  const curve=c=>{let d='';for(let e=50;e<=180;e+=2)d+=(e===50?'M':'L')+FX(e).toFixed(1)+' '+FY(Math.min(FY1,c*fsCurve(e))).toFixed(1);return d;};
  let h='';
  for(let v=60;v<=180;v+=20)h+=`<line class="gl" x1="${FX(v)}" x2="${FX(v)}" y1="${FT}" y2="${FH-FB}"/><text x="${FX(v)}" y="${FH-FB+15}" text-anchor="middle">${v}</text>`;
  for(let v=0;v<=100;v+=20)h+=`<line class="gl" x1="${FL}" x2="${FW-FR}" y1="${FY(v)}" y2="${FY(v)}"/><text x="${FL-6}" y="${FY(v)+4}" text-anchor="end">${v}</text>`;
  h+=`<line class="ax" x1="${FL}" x2="${FW-FR}" y1="${FH-FB}" y2="${FH-FB}"/><line class="ax" x1="${FL}" x2="${FL}" y1="${FT}" y2="${FH-FB}"/>`;
  h+=`<text x="${(FL+FW-FR)/2}" y="${FH-6}" text-anchor="middle">Filling, EDV (mL)</text><text transform="translate(13 ${(FT+FH-FB)/2}) rotate(-90)" text-anchor="middle">Stroke volume (mL)</text>`;
  h+=`<path class="c0" d="${curve(1)}"/><text x="${FX(178)}" y="${FY(fsCurve(178))+16}" text-anchor="end">normal curve</text>`;
  (curves||[]).forEach(([c,lab])=>{h+=`<path class="c2" d="${curve(c)}"/><text x="${FX(178)}" y="${FY(Math.min(FY1,c*fsCurve(178)))-6}" text-anchor="end">${lab}</text>`;});
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(b.ghost)continue;const dx=FX(b.edv)-FX(a.edv),dy=FY(b.sv)-FY(a.sv),len=Math.hypot(dx,dy);
    if(len>16){const k=(len-10)/len,ex=FX(a.edv)+dx*k,ey=FY(a.sv)+dy*k,ux=dx/len,uy=dy/len;
      h+=`<path class="trail" d="M${FX(a.edv)} ${FY(a.sv)} L${ex} ${ey}"/><path d="M${ex+ux*6} ${ey+uy*6} L${ex-ux*4-uy*5} ${ey-uy*4+ux*5} L${ex-ux*4+uy*5} ${ey-uy*4-ux*5} Z" style="fill:var(--ink)"/>`;}}
  pts.forEach((q,i)=>{const lx=FX(q.edv)+(q.right?11:-11),ly=FY(q.sv)+(q.below?22:-9);
    h+=`<circle class="pt${q.ghost?' ghost':''}" cx="${FX(q.edv)}" cy="${FY(q.sv)}" r="6.5" style="fill:${q.col}"/><text class="lbl" x="${lx}" y="${ly}" text-anchor="${q.right?'start':'end'}">${q.n}</text>`;});
  return h;
}
function classify(pt){
  const dX=Math.hypot(FX(pt.edv)-FX(B.edv),FY(pt.sv)-FY(B.sv));
  if(dX<14) return 'none';
  const off=pt.sv-fsCurve(pt.edv);
  if(Math.abs(off)<6) return pt.edv<B.edv?'along-down':'along-up';
  return off>0?'shift-up':'shift-down';
}

function predGrid(items,store,ans,notes,done){

    h=`<h2>Compare: MAP ≈ CO × SVR</h2><p class="q">Same baroreflex, opposite starting points. Each column unlocks when that case is finished.</p>
      <table class="cmp"><tr><th></th>${ORDER.map(k=>`<th>${SC[k].name}</th>`).join('')}</tr>`+
      rows.map(([r,n])=>`<tr><th>${n}</th>${ORDER.map(k=>prog[k].s3done?`<td class="a">${SC[k].cmp[r]}</td>`:`<td class="x">hidden</td>`).join('')}</tr>`).join('')+`</table>
      <div class="fb take"><b>Integration point.</b> Blood loss starts in the veins (filling ↓ → CO ↓); the reflex brings MAP back near normal with SVR ↑. Arteriodilation starts in the arterioles (SVR ↓); the reflex partly restores MAP with CO ↑. Skin color reflects skin arteriolar tone, often a clue to whether SVR is high or low.</div>
      <p class="tags">${tag('A1')} ${tag('A2')} ${tag('A3')} ${tag('BR')}</p>`;
  }
  if(step<=3) h+=`<div class="row" style="justify-content:flex-end;margin-top:.9rem"><button class="link" id="rstep" type="button">↺ Reset this step</button></div>`;
  $('card').innerHTML=h;
  const rs=$('rstep'); if(rs) rs.onclick=()=>resetStep(step);
  const c=$('card');
  c.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>pickSite(b.dataset.site));
  c.querySelectorAll('[data-k]:not([data-v])').forEach(b=>b.onclick=()=>choose1(b.dataset.k));
  c.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{(step===2?p.p2:p.p3)[b.dataset.k]=b.dataset.v;renderRight();});
  c.querySelectorAll('.colbtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;renderVisual();renderRight();});
  const tap=$('fsTap');
  if(tap&&!p.s2done) tap.addEventListener('click',e=>{const r=tap.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*FW, y=(e.clientY-r.top)/r.height*FH;
    const edv=Math.max(50,Math.min(180,invX(x))), sv=Math.max(0,Math.min(FY1,invY(y)));
    p.fsPt={edv,sv}; renderRight();});
  const chk=$('chk'),rev=$('rev'),nx=$('next');
  if(chk)chk.onclick=()=>finish(false); if(rev)rev.onclick=()=>finish(true);
  if(nx)nx.onclick=()=>{if(step<4){step++;if(step===4)view='comp';}else{const o=cur==='blood'?'vaso':'blood';if(prog[o].s3done)step=5;else{cur=o;site=null;step=1;view='base';}}renderAll();};
}
function resetStep(n){const p=P();
  if(n<=1){p.s1=null;p.s1done=false;site=null;}
  if(n<=2){p.p2={};p.fsPt=null;p.s2done=false;}
  p.p3={};p.s3done=false;
  step=n; view=progView(); renderAll();}
function revealFill(k){const s=SC[k],p=prog[k];p.s1done=true;p.s1=null;
  P2.forEach(([q])=>p.p2[q]=p.p2[q]||first(s.a2[q]));p.fsPt=p.fsPt||{edv:s.P.edv,sv:s.P.sv};p.s2done=true;
  P3.forEach(([q])=>p.p3[q]=p.p3[q]||first(s.a3[q]));p.s3done=true;}
function finish(reveal){const s=S(),p=P();
  if(step===2){if(reveal){P2.forEach(([k])=>p.p2[k]=first(s.a2[k]));p.fsPt={edv:s.P.edv,sv:s.P.sv};}p.s2done=true;view='pre';}
  else{if(reveal)P3.forEach(([k])=>p.p3[k]=first(s.a3[k]));p.s3done=true;view='comp';}
  renderAll();}
function choose1(k){const s=S(),p=P();if(k===s.change){p.s1done=true;p.s1=null;}else p.s1={k,r:k in s.partial?'part':'no'};renderAll();}
function pickSite(k){if(P().s1done)return;site=k;P().s1=null;step=1;renderRight();renderStage();}
document.querySelectorAll('.hot').forEach(el=>{el.addEventListener('click',()=>pickSite(el.dataset.site));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pickSite(el.dataset.site);}});});

function renderAll(){renderCases();$('stem').innerHTML=S().stem;renderVisual();renderRight();}
$('resetBtn').onclick=()=>{prog[cur]=fresh();site=null;view='base';step=1;renderAll();};
$('revealAll').onclick=()=>{ORDER.forEach(revealFill);view='comp';step=4;renderAll();};
renderAll();
})();
</script>

</body>
